<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="application/json; charset=UTF-8">
    <title>Backend HTML+JS Page</title>
    <script src="https://neonc0wboy.github.io/Hell/js/jquery-3.6.0.min.js"></script>
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script>
        const headers = {
            'Content-Type': 'application/json',
            'Origin': 'https://www.cveoy.com/',
            'Referer': 'https://www.cveoy.com/',
            'Accept': '*/*',
            'Accept-Language': 'en-US,en;q=0.5',
            'Accept-Encoding': 'gzip, deflate, br',
            'Connection': 'keep-alive',
            'Sec-Fetch-Mode': 'no-cors',
            'TE': 'trailers'
        };

        async function postData(url = "https://free-api.cveoy.top/v3/completions", data) {
            const response = await fetch(url, {
                method: "POST",
                mode: "cors",
                cache: "no-cache",
                credentials: "omit",
                headers: headers,
                redirect: "follow",
                referrerPolicy: "unsafe-url",
                body: data
            });
            return response.text();
        };
        async function getData(url) {
            const response = await fetch(url, {
                method: "POST",
                mode: "cors",
                cache: "no-cache",
                credentials: "omit",
                headers: headers,
                redirect: "follow",
                referrerPolicy: "unsafe-url",
                body: data
            });
            return response.text();
        };


        function sendRequest() {
//             var data = JSON.stringify({"prompt": "Provide a demon name that contains from 0 to 72 bits in name if format UTF-16"});
            getData("https://rap0boy.pythonanywhere.com/generate_random_seed?lang=ru")
                .then((response) => {
                    var seed = response;
                    console.log(response);
                    document.getElementById("seed").textContent = response;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        $(document).ready(function() {
            $('#requestForm').submit(function(event) {
                event.preventDefault();
                const userInput = $('#input').val();

                try {
                    const jsonData = JSON.parse(JSON.stringify(userInput, seed));
                    postData("https://free-api.cveoy.top/v3/completions", JSON.stringify(jsonData))
                        .then((response) => {
                            console.log(response);
                            document.getElementById("demonName").textContent = response;
                            document.getElementById("seed").textContent = response;
                        })
                        .catch(error => {
                            console.error('Error:', error);
                        });
                } catch (e) {
                    console.error('Invalid JSON input');
                    alert('Please enter valid JSON');
                }
            });
        });
    </script>
</head>
<body>
    <h1>Send Request to Backend OpenAI API</h1>

    <button onclick="sendRequest()">Generate BTC Seed</button>

    <form id="requestForm">
        <label for="input">Enter your request (JSON format):</label><br>
        <input type="text" id="input" value='{"prompt":" Напиши рэп-текст на русском языке. Используй seed в конце описаания Требования: - Полностью на русском языке - Длина: 32-48 строки (2-3 куплета + припевы - Используй близкие точные акцентные рифмы, желательно панторифмы и ритм, характерные для русского рэпа -  Сюжет должен ОБЯЗАТЕЛЬНО включать интерпретацию каждого seed-слова, желательно с акцентом на этом слове - Стиль: современный русский рэп - Включи припев (hook) - Будь креативным и оригинальным"}'><br><br>
        <input type="submit" value="Submit">
    </form>

    <div id="seed"><p></p></div>
    
    <div id="demonName"><p></p></div>
</body>
</html>
